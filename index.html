
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Госдолг США</title>
<style>
  html,body{height:100%;margin:0;padding:0;background:#fff;font-family:Arial,Helvetica,sans-serif;}
  .wrap{
    box-sizing:border-box;height:100%;width:100%;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:14px;border:2px solid #cc0000;border-radius:10px;text-align:center;
    box-shadow:0 0 0 3px #ffecec inset;
  }
  .title{color:#cc0000;font-weight:bold;font-size:clamp(13px,4.5vw,18px);
    letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;}
  .num{color:#cc0000;font-weight:bold;font-family:"Courier New",monospace;
    font-size:clamp(16px,7vw,34px);line-height:1.05;white-space:nowrap;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">Госдолг США</div>
    <div class="num" id="num">$—</div>
  </div>
<script>
var API="https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/debt_to_penny?sort=-record_date&fields=record_date,tot_pub_debt_out_amt&page[size]=1";
var PER_SEC=3.86e9/86400, base=null, baseTs=null;
function fmt(v){var w=Math.floor(v),c=Math.round((v-w)*100);if(c===100){w++;c=0;}
  return '$'+w.toLocaleString("en-US")+'.'+(c<10?'0':'')+c;}
function tick(){if(base!==null)document.getElementById("num").textContent=fmt(base+PER_SEC*(Date.now()-baseTs)/1000);}
function load(){fetch(API).then(r=>r.json()).then(d=>{var row=d.data[0];
  base=parseFloat(row.tot_pub_debt_out_amt);baseTs=Date.now();tick();
}).catch(()=>{document.getElementById("num").textContent="данные недоступны";});}
load();setInterval(tick,100);setInterval(load,6*60*60*1000);
</script>
</body>
</html>
