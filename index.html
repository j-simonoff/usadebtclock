<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Внешний долг США</title>
<style>
  html,body{height:100%;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}
  .flag{position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom,
      #b22234 0,#b22234 7.69%,#fff 7.69%,#fff 15.38%);}
  .canton{position:absolute;top:0;left:0;width:40%;height:53.8%;background:#3c3b6e;
    background-image:radial-gradient(circle,#fff 1px,transparent 1.6px);
    background-size:11px 11px;background-position:5px 5px;}
  .flag::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.45));}
  .wrap{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;padding:12px;box-sizing:border-box;}
  .plaque{transform:rotate(-1.5deg);background:#eef0f2;border-radius:10px;
    box-shadow:0 6px 16px rgba(0,0,0,.5);overflow:hidden;max-width:94%;
    border:1px solid #cfd3d8;}
  .head{background:#141414;color:#fff;text-transform:uppercase;
    font-weight:bold;letter-spacing:2px;text-align:center;
    font-size:clamp(10px,3.4vw,15px);padding:6px 14px;}
  .num{color:#d0021b;font-weight:bold;font-family:"Courier New",monospace;
    text-align:center;white-space:nowrap;padding:8px 16px 10px;
    font-size:clamp(15px,6.4vw,32px);text-shadow:0 1px 0 #fff;}
</style>
</head>
<body>
  <div class="flag"><div class="canton"></div></div>
  <div class="wrap">
    <div class="plaque">
      <div class="head">Внешний долг США</div>
      <div class="num" id="num">$ —</div>
    </div>
  </div>
<script>
var API="https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/debt_to_penny?sort=-record_date&fields=record_date,tot_pub_debt_out_amt&page[size]=1";
var PER_SEC=3.86e9/86400, base=null, baseTs=null;
function fmt(v){var w=Math.floor(v),c=Math.round((v-w)*100);if(c===100){w++;c=0;}
  return '$ '+w.toLocaleString("en-US")+'.'+(c<10?'0':'')+c;}
function tick(){if(base!==null)document.getElementById("num").textContent=fmt(base+PER_SEC*(Date.now()-baseTs)/1000);}
function load(){fetch(API).then(r=>r.json()).then(d=>{var row=d.data[0];
  base=parseFloat(row.tot_pub_debt_out_amt);baseTs=Date.now();tick();
}).catch(()=>{document.getElementById("num").textContent="данные недоступны";});}
load();setInterval(tick,100);setInterval(load,6*60*60*1000);
</script>
</body>
</html>
