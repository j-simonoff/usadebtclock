<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Внешний долг США</title>
<style>
  html,body{height:100%;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;overflow:hidden;}
  .flag{box-sizing:border-box;position:relative;height:100%;width:100%;
    display:flex;justify-content:center;align-items:center;padding:5%;}
  #flagsvg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;}
  .plate{position:relative;z-index:2;width:88%;transform:rotate(-4deg);
    background:#f2f2f2;border-radius:10px;overflow:hidden;
    box-shadow:0 6px 14px rgba(0,0,0,.45);border:1px solid #d9d9d9;}
  .plate .head{background:#111;color:#fff;font-weight:bold;text-align:center;
    letter-spacing:1px;text-transform:uppercase;font-size:clamp(10px,3.6vw,16px);padding:4% 2%;}
  .plate .body{padding:4% 5%;}
  .plate .body svg{display:block;width:100%;height:auto;}
  #numtext{fill:#cc0000;font-weight:bold;font-family:"Courier New",monospace;letter-spacing:1px;}
</style>
</head>
<body>
  <div class="flag">
    <svg id="flagsvg" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="plate">
      <div class="head">Внешний долг США</div>
      <div class="body"><svg id="numsvg" preserveAspectRatio="xMidYMid meet"><text id="numtext" x="0" y="0" dominant-baseline="text-before-edge">$—</text></svg></div>
    </div>
  </div>
<script>
// ---- флаг ----
(function(){
  var NS="http://www.w3.org/2000/svg";
  var W=1235,H=650,stripe=H/13,uW=0.4*W,uH=7*stripe;
  var f=document.getElementById("flagsvg");
  f.setAttribute("viewBox","0 0 "+W+" "+H);
  function rect(x,y,w,h,fill){var r=document.createElementNS(NS,"rect");
    r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",w);
    r.setAttribute("height",h);r.setAttribute("fill",fill);f.appendChild(r);}
  // 13 полос (первая красная)
  for(var i=0;i<13;i++) rect(0,i*stripe,W,stripe,i%2===0?"#b22234":"#fff");
  // синее поле
  rect(0,0,uW,uH,"#3c3b6e");
  // звезда как path
  function star(cx,cy,R){
    var r=R*0.382,d="",k,ang,rad,x,y;
    for(k=0;k<10;k++){ang=(-90+36*k)*Math.PI/180;rad=(k%2===0)?R:r;
      x=cx+rad*Math.cos(ang);y=cy+rad*Math.sin(ang);d+=(k===0?"M":"L")+x.toFixed(2)+" "+y.toFixed(2);}
    d+="Z";var p=document.createElementNS(NS,"path");p.setAttribute("d",d);
    p.setAttribute("fill","#fff");f.appendChild(p);}
  var R=(uW/12)*0.34;
  for(var row=1;row<=9;row++) for(var col=1;col<=11;col++)
    if((row+col)%2===0) star(uW*col/12, uH*row/10, R);
})();
// ---- госдолг ----
var API="https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/debt_to_penny?sort=-record_date&fields=record_date,tot_pub_debt_out_amt&page[size]=1";
var PER_SEC=3.86e9/86400, base=null, baseTs=null;
var svg=document.getElementById("numsvg"), t=document.getElementById("numtext");
function fmt(v){var w=Math.floor(v),c=Math.round((v-w)*100);if(c===100){w++;c=0;}
  return '$ '+w.toLocaleString("en-US")+'.'+(c<10?'0':'')+c;}
function setNum(str){t.textContent=str;var b=t.getBBox();
  svg.setAttribute("viewBox",b.x+" "+b.y+" "+b.width+" "+b.height);}
function tick(){if(base!==null)setNum(fmt(base+PER_SEC*(Date.now()-baseTs)/1000));}
function load(){fetch(API).then(r=>r.json()).then(d=>{var row=d.data[0];
  base=parseFloat(row.tot_pub_debt_out_amt);baseTs=Date.now();tick();
}).catch(()=>setNum("нет данных"));}
load();setInterval(tick,100);setInterval(load,6*60*60*1000);
</script>
</body>
</html>
